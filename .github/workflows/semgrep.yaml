name: SAST (Semgrep)

# Security-grade static analysis beyond CodeQL (#198).
#
# Semgrep runs a different engine and ruleset from CodeQL (pattern/dataflow rules
# for C#, a general security-audit pack, and a secrets pack), so it surfaces
# issues CodeQL's queries don't. Findings upload to Code Scanning (Security tab)
# as an additional signal; report-only for now (`|| true`) so a noisy new ruleset
# version can't block merges — the current baseline is clean (0 findings), so this
# can be promoted to a gate later.
#
# Uses the public Semgrep registry packs, which need no account/login. The scan
# is scoped to src/ (the shipped library) — SAST belongs on shipped code, and
# scanning test/CI-helper scripts only produces false positives (e.g. stdlib xml
# use in a CI trx parser that reads trusted, self-generated input). Repo-wide
# secret scanning is already covered by gitleaks in pr.yaml.

on:
  pull_request:
    branches:
      - main
      - vNext
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Run Semgrep from the official image pinned by digest instead of an
      # unpinned `pip install semgrep` (Scorecard Pinned-Dependencies #980, #395).
      # A step-level `uses: docker://` (not a job-level `container:`) keeps the
      # JS actions above/below on the host — the semgrep image is Alpine/musl and
      # cannot run the glibc node20 that checkout / upload-sarif need. The image
      # has no ENTRYPOINT (Cmd is `semgrep`), so we set entrypoint explicitly.
      # 1.173.0 digest resolved 2026-08-16; bump the tag+digest together on update.
      - name: Run Semgrep (digest-pinned container)
        uses: docker://semgrep/semgrep@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a
        continue-on-error: true  # report-only (baseline is clean); SARIF still uploads
        with:
          entrypoint: semgrep
          args: scan --config p/csharp --config p/security-audit --config p/secrets --sarif --output semgrep.sarif src/

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@e4c79b4e9ebfe577d446333c2e31ed81079e7b03 # v4
        with:
          sarif_file: semgrep.sarif
