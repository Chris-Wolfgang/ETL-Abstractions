name: Concurrency (Coyote)

# Systematic concurrency / race-condition testing (#207) with Microsoft Coyote.
# Coyote rewrites the assemblies to control the task scheduler, then replays each
# test under thousands of distinct interleavings — surfacing races/deadlocks that a
# normal single-schedule run never hits. `coyote test` exits non-zero on a found
# bug, so this is an enforced gate.
#
# The Coyote project targets net8.0: the Coyote 1.7.x CLI cannot load net10.0
# assemblies (it predates that runtime), and the concurrency being explored is
# runtime-agnostic. Triggers:
#   - pull_request touching src/** or the concurrency project — a lighter run
#     (1000 iterations/test) gates races before merge.
#   - schedule (weekly) + workflow_dispatch — the deep run (10000 iterations/test).
#
# The TestKit doubles have their own systematic scenarios (tests/Wolfgang.Etl.TestKit.Tests
# .Concurrency, #126): xunit-hosted Coyote TestingEngine runs. They always run: the ordinary
# test sweep runs them un-rewritten in systematic fuzzing mode (timing perturbation, no
# controlled schedule), and this workflow rewrites the assembly and sets COYOTE_REWRITTEN=1
# so the same tests run under controlled scheduling (#365). That project targets net10.0;
# `coyote rewrite` only patches the IL, so the runtime gap above does not apply.
#
# NOT implemented: the optional 24h soak (handle/thread/memory-leak hunting via
# dotnet-counters). It requires a persistent self-hosted runner, which this project
# does not have; add it here behind a `runs-on: [self-hosted]` job when one exists.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**/*.cs'
      - 'tests/Wolfgang.Etl.Abstractions.Tests.Concurrency/**'
      - 'tests/Wolfgang.Etl.TestKit.Tests.Concurrency/**'
      - '.github/workflows/coyote.yaml'
  schedule:
    - cron: '0 5 * * 1' # weekly Monday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same PR supersedes the run still in flight, so cancel it (#739). Scheduled,
  # push and manual runs are never cancelled: each one is the run of record for its commit or week.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coyote:
    name: Coyote systematic exploration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT: tests/Wolfgang.Etl.Abstractions.Tests.Concurrency
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build the concurrency project (Release)
        run: dotnet build "$PROJECT/Wolfgang.Etl.Abstractions.Tests.Concurrency.csproj" -c Release

      # The CLI version lives in .config/dotnet-tools.json, where Dependabot can keep it in
      # step with the Microsoft.Coyote packages the test projects reference.
      - name: Restore the Coyote CLI
        run: dotnet tool restore

      - name: Rewrite assemblies for the controlled scheduler
        working-directory: ${{ env.PROJECT }}
        run: dotnet coyote rewrite coyote.json

      - name: Run Coyote systematic tests
        working-directory: ${{ env.PROJECT }}
        run: |
          set -euo pipefail
          # Deep run on schedule/dispatch; a lighter gate on PRs to keep them fast.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            iterations=1000
          else
            iterations=10000
          fi
          dll="bin/Release/net8.0/Wolfgang.Etl.Abstractions.Tests.Concurrency.dll"
          # Every method marked [Microsoft.Coyote.SystematicTesting.Test] in this project, read
          # from the source so a new test runs without an edit here. The attribute sits on the
          # line above the method signature.
          mapfile -t methods < <(
            grep -hA1 --include='*.cs' -r 'SystematicTesting\.Test\]' . \
              | grep -oE '[A-Za-z_][A-Za-z0-9_]*\(' \
              | tr -d '(' \
              | sort -u
          )
          if [ "${#methods[@]}" -eq 0 ]; then
            echo "::error::No [Microsoft.Coyote.SystematicTesting.Test] method found under $PWD - nothing would be tested."
            exit 1
          fi
          echo "Coyote test methods: ${methods[*]}"
          for m in "${methods[@]}"; do
            echo "::group::coyote test $m ($iterations iterations)"
            dotnet coyote test "$dll" --method "$m" --iterations "$iterations"
            echo "::endgroup::"
          done

  coyote-testkit:
    name: Coyote systematic exploration (TestKit doubles)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT: tests/Wolfgang.Etl.TestKit.Tests.Concurrency
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build the TestKit concurrency project (Release)
        run: dotnet build "$PROJECT/Wolfgang.Etl.TestKit.Tests.Concurrency.csproj" -c Release

      # The CLI version lives in .config/dotnet-tools.json, where Dependabot can keep it in
      # step with the Microsoft.Coyote packages the test projects reference.
      - name: Restore the Coyote CLI
        run: dotnet tool restore

      - name: Rewrite assemblies for the controlled scheduler
        working-directory: ${{ env.PROJECT }}
        run: dotnet coyote rewrite rewrite.coyote.json

      - name: Run the systematic tests under the rewritten assemblies
        # Without this flag RunSystematic uses systematic fuzzing mode (what the ordinary
        # test sweep runs, since un-rewritten Coyote cannot control the schedule); with it,
        # each [Fact] drives a TestingEngine under controlled scheduling and fails on any bug.
        env:
          COYOTE_REWRITTEN: '1'
        run: dotnet test "$PROJECT/Wolfgang.Etl.TestKit.Tests.Concurrency.csproj" -c Release --no-build --logger "console;verbosity=normal"
