# TEMPORARY - issue #946. Runs on its own pull request only and is never merged; the PR is closed
# once the runs are read. Loops one test to reproduce the test-host crash
# (ArgumentOutOfRangeException 'state' from ManualResetValueTaskSourceCore.SignalCompletion via
# EtlPipelineImpl.CountExtracted).
#
# Round 2 (2026-11-18) reproduced it once on macos-arm64 net6.0 (run 35 of 50); the only
# EtlPipelineCoreTests test in flight was RunAsync_throttles_in_flight_progress_instead_of_reporting_every_record.
# Round 3 loops that test alone on net6.0 and net8.0, on two ARM64 runners and one x64 control, to see
# whether the crash follows the runtime version.
name: Repro 946

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/repro-946.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  VSTEST_CONNECTION_TIMEOUT: 300
  TEST_PROJECT: tests/Wolfgang.Etl.Abstractions.Tests.Unit/Wolfgang.Etl.Abstractions.Tests.Unit.csproj
  TEST_FILTER: FullyQualifiedName~EtlPipelineCoreTests.RunAsync_throttles_in_flight_progress_instead_of_reporting_every_record
  ITERATIONS: 200

jobs:
  loop:
    name: ${{ matrix.framework }} x200 on ${{ matrix.label }} (shard ${{ matrix.shard }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, ubuntu-24.04-arm, ubuntu-latest]
        framework: [net6.0, net8.0]
        shard: [1, 2]
        include:
          - { runner: macos-latest,     label: macos-arm64 }
          - { runner: ubuntu-24.04-arm, label: linux-arm64 }
          - { runner: ubuntu-latest,    label: linux-x64-control }
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            11.0.x

      - name: Build
        env:
          FRAMEWORK: ${{ matrix.framework }}
        run: dotnet build "$TEST_PROJECT" -c Release -f "$FRAMEWORK"

      - name: Loop the test
        env:
          LABEL: ${{ matrix.label }}
          SHARD: ${{ matrix.shard }}
          FRAMEWORK: ${{ matrix.framework }}
        run: |
          # The runner's bash has -e; a failing dotnet test must not end the loop.
          set +e
          set -uo pipefail
          out="$RUNNER_TEMP/repro"
          mkdir -p "$out"
          crashes=0; failures=0; passes=0
          for i in $(seq 1 "$ITERATIONS"); do
            log="$out/run-$i.log"
            dotnet test "$TEST_PROJECT" -c Release -f "$FRAMEWORK" --no-build --filter "$TEST_FILTER" \
              --blame-crash --blame-crash-dump-type mini \
              --results-directory "$out/results-$i" > "$log" 2>&1
            rc=$?
            if grep -qE 'Test host process crashed|The active test run was aborted' "$log"; then
              crashes=$((crashes + 1))
              echo "::error::Run $i on $LABEL $FRAMEWORK shard $SHARD: test host crashed"
              grep -nE 'crashed|aborted|ArgumentOutOfRange|SignalCompletion|CountExtracted' "$log" | head -20
            elif [ "$rc" -ne 0 ]; then
              failures=$((failures + 1))
              echo "::warning::Run $i on $LABEL $FRAMEWORK shard $SHARD: exit $rc without a crash"
              grep -E '^\s+Failed |Failed!' "$log" | head -10
              rm -rf "$out/results-$i"
            else
              # dotnet test exits 0 when it finds no tests, so a pass only counts with a test total.
              total=$(grep -oE 'Total: +[0-9]+' "$log" | grep -oE '[0-9]+' | head -1)
              if [ -z "$total" ] || [ "$total" -eq 0 ]; then
                failures=$((failures + 1))
                echo "::warning::Run $i on $LABEL $FRAMEWORK shard $SHARD: exit 0 but no test total in the log"
              else
                passes=$((passes + 1))
                echo "run $i: $total tests" >> "$out/test-counts.txt"
                rm -rf "$out/results-$i" "$log"
              fi
            fi
          done
          [ -f "$out/test-counts.txt" ] && echo "tests per passing run: $(awk '{print $3}' "$out/test-counts.txt" | sort -u | tr '\n' ' ')"
          dotnet --list-runtimes | grep NETCore.App
          summary="$LABEL $FRAMEWORK shard $SHARD: $ITERATIONS runs, $passes passed (with a test total), $failures failed without a crash, $crashes crashed"
          echo "$summary"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
          echo "$summary" > "$out/summary.txt"
          [ "$crashes" -eq 0 ]

      - name: Upload logs and crash dumps
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: repro-946-${{ matrix.label }}-${{ matrix.framework }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/repro/
          retention-days: 14
          if-no-files-found: ignore
